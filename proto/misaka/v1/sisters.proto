syntax = "proto3";
package misaka.v1;
option go_package = "github.com/MisakaNetwork/MisakaNetwork/gen/misaka/v1;misakav1";

// All calls require mutual TLS. Cookie and configuration fields are write-only.
service Sisters {
  rpc GetStatus(Empty) returns (AgentStatus);
  rpc SubmitTask(TaskRequest) returns (TaskStatus);
  rpc CancelTask(TaskId) returns (TaskStatus);
}
message Empty {}
message TaskId { string id = 1; }
message TaskRequest {
  string id = 1;
  string name = 2;
  string cookie_json = 3;
  string config_json = 4;
  // Purchase start in Beijing time (UTC+8) as YYYY-MM-DDTHH:MM:SS, whatever
  // the agent's own time zone. Empty starts immediately after submission.
  string time_start = 5;
}
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCELLED = 5;
}
message TaskEvent {
  int64 timestamp_unix_ms = 1;
  string level = 2;
  string message = 3;
}
// Sensitive, in-memory payment information for a confirmed order. Never copy
// payment URLs into task messages or events. Presence does not mean paid.
message OrderPayment {
  string order_id = 1;
  // Canonical Bilibili order page, derived from the validated order ID.
  string order_detail_url = 2;
  // Validated QR content, not an image URL. Empty falls back to the order page.
  string payment_code_url = 3;
  // Time Sisters received the final result; not a payment expiry timestamp.
  int64 captured_unix_ms = 4;
}
message TaskStatus {
  string id = 1;
  string name = 2;
  TaskState state = 3;
  string message = 4;
  int64 updated_unix_ms = 5;
  repeated TaskEvent events = 6;
  OrderPayment payment = 7;
}
message AgentStatus {
  string version = 1;
  string bili_version = 2;
  string platform = 3;
  int64 started_unix_ms = 4;
  repeated TaskStatus tasks = 5;
  int32 max_concurrency = 6;
  bool runtime_ready = 7;
  // Agents without this flag ignore TaskRequest.time_start and would start a
  // timed task immediately, so clients must not send timed tasks to them.
  bool supports_time_start = 8;
}
