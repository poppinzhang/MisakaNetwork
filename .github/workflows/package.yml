name: Package offline release
on:
  workflow_dispatch:
    inputs:
      android_test_signing:
        description: Use a debug key for test-only Android APKs
        type: boolean
        default: false
  workflow_call:
    inputs:
      android_test_signing:
        description: Use a debug key for test-only Android APKs
        type: boolean
        default: false
    secrets:
      MISAKA_ANDROID_KEYSTORE_BASE64:
        required: false
      MISAKA_ANDROID_STORE_PASSWORD:
        required: false
      MISAKA_ANDROID_KEY_ALIAS:
        required: false
      MISAKA_ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      artifact_name:
        value: ${{ jobs.prepare.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dist_dir: ${{ steps.metadata.outputs.dist_dir }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        run: python3 scripts/release_ci.py metadata --github-output "$GITHUB_OUTPUT"
      - name: Check release signing settings before building
        if: ${{ !inputs.android_test_signing }}
        env:
          MISAKA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MISAKA_ANDROID_KEYSTORE_BASE64 }}
          MISAKA_ANDROID_STORE_PASSWORD: ${{ secrets.MISAKA_ANDROID_STORE_PASSWORD }}
          MISAKA_ANDROID_KEY_ALIAS: ${{ secrets.MISAKA_ANDROID_KEY_ALIAS }}
          MISAKA_ANDROID_KEY_PASSWORD: ${{ secrets.MISAKA_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          keys = ('MISAKA_ANDROID_KEYSTORE_BASE64', 'MISAKA_ANDROID_STORE_PASSWORD',
                  'MISAKA_ANDROID_KEY_ALIAS', 'MISAKA_ANDROID_KEY_PASSWORD')
          if not all(os.environ.get(key) for key in keys):
              raise SystemExit('All four Android release signing secrets are required')
          try:
              if not base64.b64decode(os.environ[keys[0]], validate=True):
                  raise ValueError('Empty keystore')
          except ValueError:
              raise SystemExit('Android release keystore must be non-empty valid base64')
          PY
  bundles:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: macos-amd64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./... && go vet ./...
      - name: Install isolated runtime build dependencies
        run: |
          python -m venv .build/runtime-venv
          .build/runtime-venv/bin/python -m pip install -r runtime/requirements-build.lock
          .build/runtime-venv/bin/python -m pip check
      - run: .build/runtime-venv/bin/python -m unittest discover -s runtime/tests -v
      - run: .build/runtime-venv/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: .build/runtime-venv/bin/python runtime/build.py --output .build/runtime/${{ matrix.target }}
      - run: .build/runtime-venv/bin/python runtime/check_bundle.py .build/runtime/${{ matrix.target }}/misaka-runtime/misaka-runtime
      # Upstream wheels may contain generic runner-home paths; scan this checkout's specific path.
      - run: .build/runtime-venv/bin/python runtime/check_privacy.py .build/runtime/${{ matrix.target }}/misaka-runtime --marker "$GITHUB_WORKSPACE"
      - run: python scripts/build_bundles.py --targets ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: internal-bundle-${{ matrix.target }}
          path: |
            .build/bundles/${{ matrix.target }}.tar.gz
            .build/bundles/${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  macos:
    needs: [prepare, bundles]
    timeout-minutes: 120
    env:
      RELEASE_DIR: ${{ needs.prepare.outputs.dist_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: internal-bundle-*
          path: .build/bundles
          merge-multiple: true
      - run: python scripts/index_bundles.py .build/bundles
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git /tmp/misaka-flutter
          echo /tmp/misaka-flutter/bin >> "$GITHUB_PATH"
      - name: Test LastOrder
        working-directory: LastOrder
        run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
      - run: python scripts/build_macos.py
      - name: Restore native local runtime
        run: |
          mkdir -p .build/unpack .build/runtime/macos-${{ matrix.arch }}
          tar -xzf .build/bundles/macos-${{ matrix.arch }}.tar.gz -C .build/unpack
          mv .build/unpack/runtime .build/runtime/macos-${{ matrix.arch }}/misaka-runtime
      - run: python scripts/package_macos.py --app .build/LastOrder.app --arch ${{ matrix.arch }}
      - run: python scripts/check_release.py "$RELEASE_DIR" --target macos-${{ matrix.arch }} --forbid "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: internal-app-macos-${{ matrix.arch }}
          path: |
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/*.sha256
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  windows:
    needs: [prepare, bundles]
    timeout-minutes: 120
    env:
      RELEASE_DIR: ${{ needs.prepare.outputs.dist_dir }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/control ./cmd/misakactl
      - run: go vet ./internal/control ./cmd/misakactl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: internal-bundle-*
          path: .build/bundles
          merge-multiple: true
      - run: python scripts/index_bundles.py .build/bundles
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git C:/misaka-flutter
          Add-Content $env:GITHUB_PATH C:/misaka-flutter/bin
      - name: Test LastOrder
        working-directory: LastOrder
        run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
      - name: Install isolated runtime build dependencies
        run: |
          python -m venv .build/runtime-venv
          .build/runtime-venv/Scripts/python.exe -m pip install -r runtime/requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .build/runtime-venv/Scripts/python.exe -m pip check
      - run: .build/runtime-venv/Scripts/python.exe runtime/build.py --output .build/runtime/windows-amd64
      - run: .build/runtime-venv/Scripts/python.exe runtime/check_bundle.py .build/runtime/windows-amd64/misaka-runtime/misaka-runtime.exe
      # Upstream wheels may contain generic runner-home paths; scan this checkout's specific path.
      - run: .build/runtime-venv/Scripts/python.exe runtime/check_privacy.py .build/runtime/windows-amd64/misaka-runtime --marker "$env:GITHUB_WORKSPACE"
      - run: python scripts/build_windows.py
      - run: python scripts/package_windows.py
      - run: python scripts/check_release.py "$env:RELEASE_DIR" --target windows-amd64 --forbid "$env:GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: internal-app-windows-amd64
          path: |
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/*.sha256
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  android:
    needs: [prepare, bundles]
    timeout-minutes: 120
    env:
      RELEASE_DIR: ${{ needs.prepare.outputs.dist_dir }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and select the required Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: internal-bundle-*
          path: .build/bundles
          merge-multiple: true
      - run: python scripts/index_bundles.py .build/bundles
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git /tmp/misaka-flutter
          echo /tmp/misaka-flutter/bin >> "$GITHUB_PATH"
      - name: Restore release keystore
        if: ${{ !inputs.android_test_signing }}
        env:
          MISAKA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MISAKA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('MISAKA_ANDROID_KEYSTORE_BASE64')
          if not value:
              raise SystemExit('Release signing secret is required; test signing must be selected explicitly')
          path = Path(os.environ['RUNNER_TEMP']) / 'misaka-release.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MISAKA_ANDROID_KEYSTORE={path}\n')
          PY
      - name: Package Android
        env:
          MISAKA_ANDROID_STORE_PASSWORD: ${{ secrets.MISAKA_ANDROID_STORE_PASSWORD }}
          MISAKA_ANDROID_KEY_ALIAS: ${{ secrets.MISAKA_ANDROID_KEY_ALIAS }}
          MISAKA_ANDROID_KEY_PASSWORD: ${{ secrets.MISAKA_ANDROID_KEY_PASSWORD }}
          MISAKA_ANDROID_TEST_SIGNING: ${{ inputs.android_test_signing }}
        run: |
          if [ "$MISAKA_ANDROID_TEST_SIGNING" = true ]; then
            unset MISAKA_ANDROID_STORE_PASSWORD MISAKA_ANDROID_KEY_ALIAS MISAKA_ANDROID_KEY_PASSWORD
            python scripts/package_android.py --allow-debug-signing
          else
            python scripts/package_android.py
          fi
      - name: Remove temporary Android signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/misaka-release.keystore"
      - run: python scripts/check_release.py "$RELEASE_DIR" --target android-arm64 --target android-amd64 --forbid "$GITHUB_WORKSPACE" --forbid "$RUNNER_TEMP/misaka-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: internal-app-android
          path: |
            ${{ env.RELEASE_DIR }}/*.apk
            ${{ env.RELEASE_DIR }}/*.sha256
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  complete-release:
    needs: [prepare, macos, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_DIR: ${{ needs.prepare.outputs.dist_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: internal-app-*
          path: .build/release-inputs
      - run: python scripts/release_manifest.py .build/release-inputs/internal-app-* --output "$RELEASE_DIR"
      - run: python scripts/check_release.py "$RELEASE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: |
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-macos-amd64.zip
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-macos-amd64.zip.sha256
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-macos-arm64.zip
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-macos-arm64.zip.sha256
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-windows-amd64.zip
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-windows-amd64.zip.sha256
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-android-arm64.apk
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-android-arm64.apk.sha256
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-android-amd64.apk
            ${{ env.RELEASE_DIR }}/LastOrder-${{ needs.prepare.outputs.version }}-android-amd64.apk.sha256
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
