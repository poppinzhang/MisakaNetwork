name: Verify source
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python -m unittest discover -s runtime/tests -v
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  lastorder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
          - runner: windows-2022
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        if: runner.os == 'Windows'
        env:
          MISAKA_TEST_WINDOWS_SERVICE: '1'
      - run: go vet ./...
        if: runner.os == 'Windows'
      - name: Install pinned Flutter on macOS
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git /tmp/misaka-flutter
          echo /tmp/misaka-flutter/bin >> "$GITHUB_PATH"
      - name: Install pinned Flutter on Windows
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git C:/misaka-flutter
          Add-Content $env:GITHUB_PATH C:/misaka-flutter/bin
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: LastOrder
      - run: flutter build ${{ matrix.platform }} --release
        working-directory: LastOrder
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the embedded Android client with its packaged Python dependencies
        run: |
          venv="$RUNNER_TEMP/android-client-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --only-binary=:all: -r runtime/requirements-android.lock
          "$venv/bin/python" -m pip check
          # Match the APK's pure-Python HTTP/2 and QR dependency set.
          "$venv/bin/python" -c 'import importlib.util as u, h2, httpcore, httpx, png, qrcode; assert all(u.find_spec(name) is None for name in ("PIL", "brotli", "zstandard"))'
          "$venv/bin/python" -m unittest discover -s runtime/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and select the required Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git /tmp/misaka-flutter
          echo /tmp/misaka-flutter/bin >> "$GITHUB_PATH"
      - run: python scripts/build_android_native.py
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: LastOrder
      - run: flutter build apk --release --target-platform android-arm64,android-x64
        working-directory: LastOrder
        env:
          MISAKA_ANDROID_ALLOW_DEBUG_SIGNING: '1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Python, JNI and Keystore on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: LastOrder
          # Source verification has no offline deployment bundles.
          script: flutter test integration_test/android_embedded_test.dart -d emulator-5554 --name 'Android (embedded|JNI|Keystore)'
