name: Verify source
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python -m unittest discover -s runtime/tests -v
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  lastorder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
          - runner: windows-2022
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/control ./cmd/misakactl
        if: runner.os == 'Windows'
      - run: go vet ./internal/control ./cmd/misakactl
        if: runner.os == 'Windows'
      - name: Install pinned Flutter on macOS
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git /tmp/misaka-flutter
          echo /tmp/misaka-flutter/bin >> "$GITHUB_PATH"
      - name: Install pinned Flutter on Windows
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git C:/misaka-flutter
          Add-Content $env:GITHUB_PATH C:/misaka-flutter/bin
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: LastOrder
      - run: flutter build ${{ matrix.platform }} --release
        working-directory: LastOrder
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git /tmp/misaka-flutter
          echo /tmp/misaka-flutter/bin >> "$GITHUB_PATH"
      - run: python scripts/build_android_native.py
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
        working-directory: LastOrder
      - run: flutter build apk --release --target-platform android-arm64,android-x64
        working-directory: LastOrder
        env:
          MISAKA_ANDROID_ALLOW_DEBUG_SIGNING: '1'
